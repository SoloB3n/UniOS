# Register the non-native formats with binfmt_misc, so that ./program.exe or
# a macOS binary start like any Linux program.
# Format: :name:type:offset:magic:mask:interpreter:flags
:uos-pe:M::MZ::/usr/lib/uos/uos-binfmt:
:uos-macho64:M::\xcf\xfa\xed\xfe::/usr/lib/uos/uos-binfmt:
:uos-macho32:M::\xce\xfa\xed\xfe::/usr/lib/uos/uos-binfmt:
:uos-machofat:M::\xca\xfe\xba\xbe::/usr/lib/uos/uos-binfmt:
