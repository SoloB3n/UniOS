name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      pubblica:
        description: "Pubblica la ISO come release di anteprima"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: python3 -W error::ResourceWarning -m unittest discover -s tests -t . -v

      - name: Sintassi degli script shell
        run: |
          for f in build/*.sh build/ci/*.sh system/bin/uos system/bin/uos-binfmt \
                   system/bin/uos-selftest packaging/deb/p* build/live/config/hooks/live/*; do
            sh -n "$f"
          done

      - name: Pacchetto .deb
        run: OUT=dist ./build/build-deb.sh

      - name: Installazione e rimozione di prova del .deb
        run: |
          sudo apt-get install -y --no-install-recommends ./dist/universalos_*_all.deb
          cd / && uos --version && uos run /bin/echo ok && (uos doctor || true)
          sudo apt-get purge -y universalos
          test ! -e /usr/lib/uos

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  iso:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Versione
        run: echo "VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' uos/__init__.py)" >> "$GITHUB_ENV"

      # /mnt è il disco grande del runner (~70 GB liberi)
      - name: Build della ISO (Debian trixie, live-build)
        run: |
          sudo mkdir -p /mnt/uos
          df -h / /mnt
          docker run --rm --privileged -v "$PWD:/src:ro" -v /mnt/uos:/work debian:trixie sh -euxc '
            apt-get update
            apt-get install -y --no-install-recommends live-build debootstrap make dpkg-dev ca-certificates
            WORK=/work/amd64 ARCH=amd64 /src/build/build-iso.sh'
          ls -lh /mnt/uos/amd64/*.iso

      - name: Collaudo della ISO in QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          sudo chmod -R a+rX /mnt/uos/amd64/binary/live
          sudo chmod a+r /mnt/uos/amd64/*.iso
          LOG=boot-test.log ./build/ci/boot-test.sh /mnt/uos/amd64

      - name: Log del collaudo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-log
          path: boot-test.log
          if-no-files-found: ignore

      - name: Prepara i file della release
        run: |
          DIST=/mnt/uos/dist
          sudo mkdir -p "$DIST" && sudo chown "$(id -u)" "$DIST"
          NAME="UniversalOS-$VERSION-amd64.iso"
          cp /mnt/uos/amd64/*.iso "$DIST/$NAME"
          cp /mnt/uos/amd64/config/packages.chroot/universalos_*_all.deb "$DIST/"
          (cd "$DIST" && sha256sum "$NAME" universalos_*_all.deb > SHA256SUMS)
          # Le release GitHub accettano file fino a 2 GiB: oltre, la ISO va in parti
          NOTES=/mnt/uos/notes.md
          sed -e '/^<!-- parti -->/,/^<!-- \/parti -->/d' -e "s/@VERSION@/$VERSION/g" -e "s/@NAME@/$NAME/g" \
            build/ci/release-notes.md > "$NOTES"
          if [ "$(stat -c %s "$DIST/$NAME")" -gt 2000000000 ]; then
            split -b 1900M -d -a 1 "$DIST/$NAME" "$DIST/$NAME.part"
            rm "$DIST/$NAME"
            sed -n '/^<!-- parti -->/,/^<!-- \/parti -->/p' build/ci/release-notes.md \
              | sed -e '/^<!--/d' -e "s/@NAME@/$NAME/g" >> "$NOTES"
          fi
          ls -lh "$DIST"

      - name: Pubblica la release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.pubblica
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}-anteprima.{1}', env.VERSION, github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('UniversalOS {0}', github.ref_name) || format('UniversalOS {0} (anteprima {1})', env.VERSION, github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          body_path: /mnt/uos/notes.md
          files: /mnt/uos/dist/*
