name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the ISO as a preview release"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Shell script syntax
        run: |
          for f in build/*.sh build/ci/*.sh system/bin/* packaging/deb/post* build/live/config/hooks/live/*; do
            sh -n "$f"
          done

  deb:
    needs: test
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the .deb
        run: OUT=dist ./build/build-deb.sh

      - name: Install and remove the .deb
        run: |
          sudo apt-get install -y --no-install-recommends ./dist/unios_*_${{ matrix.arch }}.deb
          cd / && uos --version && uos run /bin/echo ok && (uos doctor || true)
          sudo apt-get purge -y unios
          test ! -e /usr/bin/uos && test ! -e /usr/lib/uos

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb

  iso:
    needs: deb
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: debs
          merge-multiple: true

      # /mnt is the runner's big disk (~70 GB free)
      - name: Build the ISO (Debian trixie, live-build)
        run: |
          sudo mkdir -p /mnt/uos
          df -h / /mnt
          docker run --rm --privileged -v "$PWD:/src:ro" -v /mnt/uos:/work debian:trixie sh -euxc '
            apt-get update
            apt-get install -y --no-install-recommends live-build debootstrap make dpkg-dev ca-certificates
            UOS_DEB=$(ls /src/debs/unios_*_amd64.deb) WORK=/work/amd64 ARCH=amd64 /src/build/build-iso.sh'
          ls -lh /mnt/uos/amd64/*.iso

      - name: Test the ISO in QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          sudo chmod -R a+rX /mnt/uos/amd64/binary/live
          sudo chmod a+r /mnt/uos/amd64/*.iso
          LOG=boot-test.log ./build/ci/boot-test.sh /mnt/uos/amd64

      - name: Boot test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-log
          path: boot-test.log
          if-no-files-found: ignore

      - name: Prepare the release files
        run: |
          DIST=/mnt/uos/dist
          sudo mkdir -p "$DIST" && sudo chown "$(id -u)" "$DIST"
          NAME="UniOS-$VERSION-amd64.iso"
          cp /mnt/uos/amd64/*.iso "$DIST/$NAME"
          cp debs/unios_*.deb "$DIST/"
          (cd "$DIST" && sha256sum "$NAME" unios_*.deb > SHA256SUMS)
          # GitHub releases accept files up to 2 GiB: beyond that the ISO is split
          NOTES="$RUNNER_TEMP/notes.md"
          sed -e '/^<!-- parts -->/,/^<!-- \/parts -->/d' -e "s/@VERSION@/$VERSION/g" -e "s/@NAME@/$NAME/g" \
            build/ci/release-notes.md > "$NOTES"
          if [ "$(stat -c %s "$DIST/$NAME")" -gt 2000000000 ]; then
            split -b 1900M -d -a 1 "$DIST/$NAME" "$DIST/$NAME.part"
            rm "$DIST/$NAME"
            sed -n '/^<!-- parts -->/,/^<!-- \/parts -->/p' build/ci/release-notes.md \
              | sed -e '/^<!--/d' -e "s/@NAME@/$NAME/g" >> "$NOTES"
          fi
          ls -lh "$DIST"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}-preview.{1}', env.VERSION, github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('UniOS {0}', github.ref_name) || format('UniOS {0} (preview {1})', env.VERSION, github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          body_path: ${{ runner.temp }}/notes.md
          files: /mnt/uos/dist/*
